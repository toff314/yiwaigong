
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>忆·外公 · 线上追思</title>
<link rel="stylesheet" href="/lanterns.css">
<style>
:root{ --bg:#0d0c0a; --ink:#fffdf6; --gold:#e8c987; --muted:#cfc5b3; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:"Noto Serif SC","Songti SC","STSong",serif;color:var(--ink)}
#stage{position:fixed;inset:0}

/* ---- 封面 ---- */
#cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 42%, #191612 0%, #0d0c0a 70%);z-index:50;transition:opacity 2s;cursor:pointer;overflow:hidden}
#cover.hide{opacity:0;pointer-events:none}
#cover .sky{opacity:.6}
#cover > :not(.sky){position:relative;z-index:1}
#cover .chrys{width:54px;height:54px;opacity:.85;margin-bottom:26px;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:.95}}
#cover h1{font-size:clamp(34px,6.5vw,58px);font-weight:600;letter-spacing:.4em;text-indent:.4em;text-shadow:0 0 46px rgba(232,201,135,.25)}
#cover .years{margin-top:18px;color:var(--gold);font-size:clamp(16px,2.6vw,21px);letter-spacing:.5em;text-indent:.5em}
#cover .divider{width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:26px auto}
#cover .verse{color:var(--muted);font-size:clamp(15px,2.2vw,18px);letter-spacing:.2em;line-height:2.4;text-align:center}
#cover .meta{margin-top:20px;color:var(--muted);font-size:13px;letter-spacing:.15em;text-align:center;line-height:2}
#cover .tap{margin-top:30px;color:var(--gold);font-size:14px;letter-spacing:.3em;text-indent:.3em;padding:11px 28px;border:1px solid rgba(201,168,106,.55);border-radius:999px;background:rgba(201,168,106,.06);box-shadow:0 0 18px rgba(201,168,106,.08) inset;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}

/* ---- 留影墙 ---- */
.wall{position:absolute;inset:0;background:var(--bg)}
.wall .ph{position:absolute;border-radius:4px;overflow:hidden;box-shadow:0 12px 50px rgba(0,0,0,.65);opacity:0;transition:opacity 2.2s ease}
.wall .ph.show{opacity:1}
.wall .ph img{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.wall .tag{position:absolute;bottom:10px;left:12px;font-size:clamp(12px,1.8vw,16px);color:rgba(255,253,246,.95);text-shadow:0 1px 8px #000;letter-spacing:.1em}

/* ---- 单幅大图 ---- */
.hero{position:absolute;inset:0;background:radial-gradient(ellipse at center,#1d1912 0%,#080706 72%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero .fg{position:relative;max-width:100%;max-height:100dvh;width:auto;height:auto;object-fit:contain;object-position:center center;margin:auto;border:1px solid rgba(201,168,106,.16);box-shadow:0 20px 80px rgba(0,0,0,.6);display:block}
.hero .dim{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0) 45%);pointer-events:none}
.hero .cap{position:absolute;left:0;right:0;bottom:6vh;text-align:center;padding:0 6vw}
.hero .cap .txt{font-size:clamp(23px,4.4vw,38px);letter-spacing:.18em;text-indent:.18em;color:var(--ink);text-shadow:0 2px 24px #000,0 0 10px rgba(0,0,0,.8);line-height:1.7;font-weight:600}
.hero .cap .who{margin-top:14px;font-size:clamp(15px,2.3vw,19px);color:var(--gold);letter-spacing:.25em;text-indent:.25em;text-shadow:0 2px 12px #000;font-weight:500}
.hero .cat{position:absolute;left:3vw;top:3vh;color:rgba(232,201,135,.85);font-size:clamp(13px,1.9vw,17px);letter-spacing:.3em;text-shadow:0 1px 10px #000}
.fade{transition:opacity 2s}
.fade.hide{opacity:0}

/* ---- 视频段落 ---- */
.vid{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
.vid video{width:100%;height:100%;object-fit:contain;background:#000}

/* ---- 黑场过渡卡 ---- */
.black{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:40;transition:opacity 1.4s;overflow:hidden}
.black > :not(.sky){position:relative;z-index:1;text-align:center;max-width:86vw}
.black .big{color:var(--gold);font-size:clamp(34px,8vw,72px);letter-spacing:.5em;text-indent:.5em;text-align:center;text-shadow:0 0 40px rgba(232,201,135,.28);font-weight:600}
.black .yr{color:var(--gold);font-size:clamp(22px,4vw,34px);letter-spacing:.45em;text-indent:.45em;text-align:center}
.black .txt{margin:20px auto 0;color:var(--muted);font-size:clamp(24px,4.2vw,38px);letter-spacing:.26em;text-indent:.26em;text-align:center;text-shadow:0 0 26px rgba(0,0,0,.8)}
.black .line{width:84px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:26px auto}
.msgscene .quote{color:rgba(201,168,106,.32);font-size:clamp(46px,8vw,88px);line-height:1;margin-bottom:4px}
.msgscene .txt{margin:0 auto;max-width:78vw;color:var(--ink);font-size:clamp(26px,4.6vw,46px);line-height:1.85;letter-spacing:.08em;text-shadow:0 2px 24px #000;white-space:pre-wrap;word-break:break-word}
.msgscene .who{margin-top:26px;color:var(--gold);font-size:clamp(16px,2.4vw,22px);letter-spacing:.25em;text-indent:.25em}

/* 角标 & 水印 */
#corner{position:fixed;left:3vw;bottom:3vh;z-index:60;color:rgba(232,201,135,.72);font-size:clamp(12px,1.7vw,15px);letter-spacing:.28em;pointer-events:none}
#exit{position:fixed;top:2vh;right:2.5vw;z-index:61;color:rgba(232,226,213,.35);font-size:20px;background:none;border:none;cursor:pointer;letter-spacing:.1em}
#audioHint{position:fixed;right:2.5vw;bottom:3vh;z-index:62;color:rgba(201,168,106,.55);font-size:12px;letter-spacing:.15em;display:none}
</style>
</head>
<body>
<div id="stage"></div>

<div id="cover">
  <div class="sky" id="cover-lanterns" aria-hidden="true"></div>
  <svg class="chrys" viewBox="0 0 48 48" fill="none"><g stroke="#c9a86a" stroke-width="1.1"><circle cx="24" cy="24" r="3.2"/><ellipse cx="24" cy="13" rx="4.4" ry="7.2"/><ellipse cx="24" cy="35" rx="4.4" ry="7.2"/><ellipse cx="13" cy="24" rx="7.2" ry="4.4"/><ellipse cx="35" cy="24" rx="7.2" ry="4.4"/><g opacity=".55" transform="rotate(45 24 24)"><ellipse cx="24" cy="13.5" rx="3.8" ry="6.6"/><ellipse cx="24" cy="34.5" rx="3.8" ry="6.6"/><ellipse cx="13.5" cy="24" rx="6.6" ry="3.8"/><ellipse cx="34.5" cy="24" rx="6.6" ry="3.8"/></g></g></svg>
  <h1 id="c-title">忆·外公</h1>
  <div class="years" id="c-years">1938 — 2026</div>
  <div class="divider"></div>
  <div class="verse">音容宛在 · 风范长存<br><span style="font-size:.85em">已收集 <span id="c-cnt">…</span> 份回忆 · <span id="c-lamps">…</span> 盏心灯亮起</span></div>
  <div class="meta" id="c-meta"></div>
  <div class="tap">— 点 击 开 始 —</div>
</div>
<button id="exit" title="退出全屏" onclick="if(document.fullscreenElement){document.exitFullscreen()}else{document.documentElement.requestFullscreen()}">⤢</button>
<div id="corner"></div>
<div id="audioHint">点击任意处开启背景音乐</div>

<script src="/lanterns.js"></script>
<script>
let DATA=null, stage=document.getElementById('stage'), bgm=null, bgmOn=false;
let lampCount=0;
fetch('/api/lamps').then(r=>r.json()).then(d=>{
  lampCount=Math.max(0, Number(d.lamps)||0);
  const el=document.getElementById('c-lamps'); if(el) el.textContent=lampCount;
  if(window.Lanterns) Lanterns.render(document.getElementById('cover-lanterns'), lampCount, {max:20});
}).catch(()=>{});
function lightLamp(){
  fetch('/api/lamps',{method:'POST',keepalive:true}).then(r=>r.json()).then(d=>{
    lampCount=Math.max(0,Number(d.lamps)||0);
    const el=document.getElementById('c-lamps'); if(el) el.textContent=lampCount;
  }).catch(()=>{});
}
setInterval(()=>{
  fetch('/api/lamps').then(r=>r.json()).then(d=>{
    lampCount=Math.max(0,Number(d.lamps)||0);
    const el=document.getElementById('c-lamps'); if(el) el.textContent=lampCount;
  }).catch(()=>{});
}, 60 * 1000);
const params=new URLSearchParams(location.search);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mediaURL = f => (f.startsWith('media/')||f.startsWith('music/') ? '/' : '/media/')+encodeURIComponent(f.split('/').pop());
const assetURL = p => !p ? '' : p.startsWith('media/') ? '/media/'+encodeURIComponent(p.slice(6)) : p.startsWith('main/') ? '/main/'+encodeURIComponent(p.slice(5)) : p;
const coverAsset = p => (p==='main/main-cover-landscape.jpg' && window.innerHeight>window.innerWidth) ? '/main/main-cover-portrait.jpg' : assetURL(p);

let settings={speed:1,playMode:'category',showCategoryCard:1,music:'',musicPlaylist:[],musicVolume:.55,loop:1};
let musicList=[], musicIndex=0, prefetchAudio=null;
const sp = () => Math.min(4, Math.max(.25, Number(settings.speed)||1));
const dur = ms => Math.max(450, ms / sp());

async function load(){
  const q=new URLSearchParams();
  for(const k of ['mode','category','speed']) if(params.get(k)) q.set(k,params.get(k));
  const d=await fetch('/api/playlist'+(q.toString()?'?'+q:'')).then(r=>r.json());
  DATA=d; settings=d.settings||settings;
  document.getElementById('c-title').textContent=d.title;
  document.getElementById('c-years').textContent=d.subtitle;
  document.getElementById('c-cnt').textContent=d.total;
  const modeName={category:'按目录顺序',sequence:'全部顺序',random:'随机播放',single:'单目录循环'}[settings.playMode]||'按目录顺序';
  const pl=(d.settings.musicPlaylist&&d.settings.musicPlaylist.length)?d.settings.musicPlaylist:(d.settings.music?[d.settings.music]:[]);
  const musicTitle=pl.length? (pl.length>1? pl.length+' 首（顺序播放）' : pl[0].replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ')) : '无';
  document.getElementById('c-meta').innerHTML=`播放方式：${modeName} · 速度 ${sp()}×<br>背景音乐：${musicTitle}`;
  document.getElementById('corner').textContent=`${modeName} · ${sp()}×`;
}
let started=false, loadPromise=null;
function ensureData(){
  if(!loadPromise) loadPromise=load().catch(e=>{ loadPromise=null; throw e; });
  return loadPromise;
}
ensureData().catch(()=>{ setTimeout(()=>ensureData().catch(()=>{}),3000); });
async function startShow(){
  if(started) return; started=true;
  lightLamp();
  const cover=document.getElementById('cover');
  if(cover) cover.classList.add('hide');
  try{ await ensureData(); }catch(e){}
  startMusic();
  // 借这次用户手势解锁常驻视频元素（iOS/Chrome 策略：手势内 play 过的元素，
  // 之后换 src 仍可带声音播放）。用库里第一个真实视频，静音播一帧即暂停。
  try{
    unlockedVideo = document.createElement('video');
    unlockedVideo.muted = true;
    unlockedVideo.playsInline = true;
    unlockedVideo.preload = 'metadata';
    const firstVideo = (DATA && DATA.items && DATA.items.find(i=>i.kind==='video'));
    if(firstVideo){
      unlockedVideo.src = mediaURL(firstVideo.filename);
      await unlockedVideo.play().then(()=>{ unlockedVideo.pause(); unlockedVideo.currentTime = 0; }).catch(()=>{});
    }
  }catch(e){ /* 解锁失败不阻塞，走原 fallback */ }
  startLoop();
}
const coverEl=document.getElementById('cover');
if(coverEl) coverEl.addEventListener('click', startShow);
document.addEventListener('keydown', e=>{
  if(!started && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); startShow(); }
});

function fadeTo(target){
  if(!bgm) return;
  let v=bgm.volume;
  const t=setInterval(()=>{ v=Math.min(target,v+.04); bgm.volume=v; if(v>=target) clearInterval(t); },120);
}
function armAudioUnlock(){
  const hint=document.getElementById('audioHint');
  if(hint) hint.style.display='block';
  const unlock=()=>{
    document.removeEventListener('pointerdown',unlock);
    document.removeEventListener('keydown',unlock);
    if(hint) hint.style.display='none';
    if(bgm && !bgmOn) bgm.play().then(()=>{ bgmOn=true; fadeTo(Math.min(1,Math.max(0,Number(settings.musicVolume)||.55))); }).catch(()=>{});
  };
  document.addEventListener('pointerdown',unlock);
  document.addEventListener('keydown',unlock);
}
function playlistFiles(){
  const pl=settings.musicPlaylist;
  if(Array.isArray(pl)&&pl.length) return pl.slice();
  return settings.music?[settings.music]:[];
}
function prefetchNext(i){
  const next=(i+1<musicList.length)?i+1:(settings.loop?0:null);
  if(next===null) return;
  const url='/music/'+encodeURIComponent(musicList[next]);
  if(prefetchAudio && prefetchAudio.dataset.src===url) return;
  prefetchAudio=new Audio(); prefetchAudio.preload='auto'; prefetchAudio.dataset.src=url; prefetchAudio.src=url; prefetchAudio.load();
}
function playTrack(i){
  if(!musicList.length) return Promise.resolve();
  musicIndex=i;
  if(bgm){ try{bgm.pause();}catch(e){} bgm.onended=null; }
  bgm=new Audio('/music/'+encodeURIComponent(musicList[i]));
  bgm.preload='auto';
  bgm.volume=0;
  bgm.onended=()=>{
    if(musicIndex+1<musicList.length) playTrack(musicIndex+1);
    else if(settings.loop) playTrack(0);
    else bgmOn=false;
  };
  return bgm.play().then(()=>{
    bgmOn=true;
    fadeTo(Math.min(1,Math.max(0,Number(settings.musicVolume)||.55)));
    prefetchNext(i);
  }).catch(()=>{ bgmOn=false; armAudioUnlock(); });
}
function startMusic(){
  musicList=playlistFiles();
  if(!musicList.length || bgm) return Promise.resolve();
  return playTrack(0);
}
function duck(on){
  if(!bgmOn||!bgm) return;
  const target=Math.min(1,Math.max(0,Number(settings.musicVolume)||.55));
  bgm.volume = on ? target*.12 : target;
}

function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }

/* ---------- 开场主图 ---------- */
async function coverScene(src, secs=9){
  const n=el(`<div class="hero fade"><img class="fg" src="${src}"></div>`);
  const img=n.querySelector('.fg');
  img.onerror=()=>{ n.remove(); };
  stage.appendChild(n);
  await sleep(120); n.classList.remove('hide');
  await sleep(dur(secs*1000));
  n.classList.add('hide'); await sleep(dur(1800)); n.remove();
}

/* ---------- 目录标题卡 ---------- */
async function categoryCard(name, count){
  const n=el(`<div class="black"><div class="sky"></div><div class="big">${name}</div><div class="line"></div><div class="txt">${count} 份回忆</div></div>`);
  if(window.Lanterns) Lanterns.render(n.querySelector('.sky'), lampCount, {max:4, minOpacity:.12, maxOpacity:.3});
  stage.appendChild(n); await sleep(120); n.style.opacity=1;
  await sleep(Math.max(4500, dur(6400)));
  n.style.opacity=0; await sleep(Math.max(1500, dur(1600))); n.remove();
}

/* ---------- 留言卡 ---------- */
async function messageScene(msg){
  const n=el(`<div class="black msgscene"><div class="sky"></div><div class="quote">“</div><div class="txt">${esc(msg.content)}</div><div class="who">— ${esc(msg.name)}</div></div>`);
  if(window.Lanterns) Lanterns.render(n.querySelector('.sky'), lampCount, {max:4, minOpacity:.12, maxOpacity:.3});
  stage.appendChild(n); await sleep(120); n.style.opacity=1;
  await sleep(Math.max(4500, dur(7000)));
  n.style.opacity=0; await sleep(Math.max(1500, dur(1600))); n.remove();
}

/* ---------- 留影墙 ---------- */
async function wallScene(photos){
  const nodes = photos.slice(0, 8).map(p=>{
    const w = 18+Math.random()*14, landscape = Math.random()>0.5;
    const n = el(`<div class="ph"><img src="${mediaURL(p.filename)}"><div class="tag">${p.category||p.year||p.uploader||''}</div></div>`);
    n.style.width=w+'vw';
    n.style.left=(Math.random()*(88-w))+'vw';
    n.style.top=(Math.random()*70)+'vh';
    n.style.aspectRatio = landscape? '4/3':'3/4';
    n.querySelector('img').onerror=()=>n.remove();
    stage.appendChild(n);
    requestAnimationFrame(()=>setTimeout(()=>n.classList.add('show'), Math.random()*1800));
    const dx=(Math.random()*4-2), dy=(Math.random()*3-1.5);
    n.animate([{transform:'translate(0,0)'},{transform:`translate(${dx}vw,${dy}vh)`}],{duration:dur(26000),easing:'ease-in-out',fill:'forwards'});
    return n;
  });
  await sleep(dur(26000));
  nodes.forEach(n=>{ n.style.opacity=0; setTimeout(()=>n.remove(),2300); });
  await sleep(dur(2400));
}

/* ---------- 单幅大图 + 寄语 ---------- */
async function heroScene(photo, secs=9){
  const stay = photo.featured ? Math.round(secs * 1.8) : secs;
  const n=el(`<div class="hero fade"><img class="fg" src="${mediaURL(photo.filename)}">
    ${photo.category?`<div class="cat">${photo.category}</div>`:''}
    <div class="dim"></div>
    <div class="cap"><div class="txt">${photo.caption||photo.year||'音容宛在'}</div><div class="who">— ${photo.uploader||'家人'}</div></div></div>`);
  const img=n.querySelector('.fg');
  img.animate([{opacity:.75},{opacity:1}],{duration:1200,easing:'ease-out',fill:'forwards'});
  img.onerror=()=>{ n.remove(); throw new Error('img fail'); };
  stage.appendChild(n);
  await sleep(120); n.classList.remove('hide');
  await sleep(dur(stay*1000));
  n.classList.add('hide'); await sleep(dur(2000)); n.remove();
}

/* ---------- 视频 ---------- */
let unlockedVideo = null;   // 借用户手势解锁过带声音播放的 video 元素
async function videoScene(item, showPre=true){
  // 过场卡：默认显示；同分类连续视频由调用方传 false 跳过
  if(showPre){
    const pre=el(`<div class="black"><div class="sky"></div><div class="yr">${item.category||item.year||''}</div><div class="txt">${item.caption||item.origname||'一段影像'}</div></div>`);
    if(window.Lanterns) Lanterns.render(pre.querySelector('.sky'), lampCount, {max:4, minOpacity:.12, maxOpacity:.3});
    stage.appendChild(pre); await sleep(120); pre.style.opacity=1; await sleep(Math.max(4000, dur(5600))); pre.style.opacity=0;
    await sleep(Math.max(1500, dur(1600))); pre.remove();
  }

  const n=el(`<div class="vid"><video src="${mediaURL(item.filename)}" playsinline></video></div>`);
  stage.appendChild(n);
  const v=n.querySelector('video');
  v.muted=false; v.volume=1;
  try{ v.playbackRate=1; }catch(e){}
  let forceDone=null;
  const done=new Promise(resolve=>{
    let settled=false, lastTime=0, lastProgress=Date.now(), maxTimer=null;
    const finish=()=>{
      if(settled) return;
      settled=true;
      clearInterval(stallTimer);
      if(maxTimer) clearTimeout(maxTimer);
      resolve();
    };
    forceDone=finish;
    v.onended=finish;
    v.onerror=finish;
    v.onabort=finish;
    const setMax=ms=>{ if(maxTimer) clearTimeout(maxTimer); maxTimer=setTimeout(finish, ms); };
    setMax(150000);
    v.addEventListener('loadedmetadata',()=>{
      if(Number.isFinite(v.duration) && v.duration>0) setMax(Math.min(240000, (v.duration+20)*1000));
    });
    const stallTimer=setInterval(()=>{
      if(settled) return;
      if(v.currentTime > lastTime + 0.05){ lastTime=v.currentTime; lastProgress=Date.now(); }
      else if(Date.now()-lastProgress > 15000){ finish(); }
    },1000);
  });
  duck(true);
  try{ await v.play(); }
  catch(e){
    // 自动播放被拒：借手势预热过的元素换 src 接管播放（保留声音）
    if(unlockedVideo){
      try{
        unlockedVideo.src = v.src;
        unlockedVideo.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;';
        n.appendChild(unlockedVideo);
        await unlockedVideo.play();
        // 用接管元素继续监听结束
        const uv=unlockedVideo;
        await new Promise(r=>{ uv.onended=r; uv.onerror=r; setTimeout(r, 240000); });
      }catch(e2){
        try{ v.muted=true; await v.play(); }catch(e3){ if(forceDone) forceDone(); }
      }
    } else {
      try{ v.muted=true; await v.play(); }catch(e2){ if(forceDone) forceDone(); }
    }
  }
  await done;
  duck(false);
  n.style.transition='opacity 1.5s'; n.style.opacity=0;
  await sleep(1600); n.remove();
}

/* ---------- 编排 ---------- */
function groupScenes(items){
  // 同分类连续视频只在第一个前显示过场卡；视频与照片交替时每段都显示
  const scenes=[];
  let prevWasVideo=false;
  for(const it of items){
    if(it.kind==='video'){
      scenes.push({type:'video', items:[it], showPre: !prevWasVideo});
      prevWasVideo=true;
    }else{
      scenes.push({type:'hero', items:[it]});
      prevWasVideo=false;
    }
  }
  return scenes;
}
function flatScenes(items){
  const scenes=[];
  for(const it of items) scenes.push(it.kind==='video'?{type:'video',items:[it]}:{type:'hero',items:[it]});
  return scenes;
}
const MESSAGE_EVERY = 9;   // 每 9 张照片后插一批留言
const MESSAGE_BATCH = 3;   // 每批 3 条
function insertMessages(scenes){
  const msgs = (DATA.messages || []).slice();
  if(!msgs.length) return scenes;
  let mi = 0, photoCount = 0;
  const lastHero = scenes.map(s => s.type).lastIndexOf('hero');
  const out = [];
  for(let i=0;i<scenes.length;i++){
    const s = scenes[i];
    out.push(s);
    if(s.type !== 'hero') continue;
    photoCount++;
    if(photoCount < MESSAGE_EVERY || mi >= msgs.length) continue;
    photoCount = 0;
    if(i >= lastHero) continue;
    for(let k=0;k<MESSAGE_BATCH && mi<msgs.length;k++,mi++){
      out.push({ type:'msg', data: msgs[mi] });
    }
  }
  return out;
}
function buildPlan(){
  const mode=settings.playMode;
  const head=settings.coverImage?[{type:'cover',src:coverAsset(settings.coverImage)}]:[];
  if(mode==='random') return insertMessages(head.concat(flatScenes(DATA.items)));
  let groups=DATA.groups||[];
  if(mode==='single' && settings.singleCategory!=='all') groups=groups.filter(g=>g.category===settings.singleCategory);
  if(mode==='sequence') return insertMessages(head.concat(flatScenes(DATA.items)));
  const scenes=head.slice();
  for(const g of groups){
    if(settings.showCategoryCard) scenes.push({type:'card', category:g.category, count:g.items.length});
    scenes.push(...groupScenes(g.items));
  }
  return insertMessages(scenes);
}

let running=false;
async function startLoop(){
  if(running) return; running=true;
  do{
    if(!DATA || !DATA.items.length){ await sleep(4000); await load().catch(()=>{}); continue; }
    const scenes=buildPlan();
    for(const s of scenes){
      if(s.type==='cover'){ try{ await coverScene(s.src); }catch(e){} }
      else if(s.type==='card'){ try{ await categoryCard(s.category,s.count); }catch(e){} }
      else if(s.type==='msg'){ try{ await messageScene(s.data); }catch(e){} }
      else if(s.type==='wall'){ try{ await wallScene(s.items); }catch(e){} }
      else if(s.type==='hero'){ for(const p of s.items){ try{ await heroScene(p); }catch(e){} } }
      else if(s.type==='video'){ try{ await videoScene(s.items[0], s.showPre!==false); }catch(e){} }
    }
    await sleep(1000);
    await load().catch(()=>{});
  }while(true);
}
</script>
